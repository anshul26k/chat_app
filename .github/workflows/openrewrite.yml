name: OpenRewrite (DevPilot)
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run OpenRewrite
        run: |
          mvn -U -B org.openrewrite.maven:rewrite-maven-plugin:run \
            -Drewrite.configLocation=rewrite.yml \
            -Drewrite.activeRecipes=com.devpilot.migration.Modernize
      - name: Show diff
        run: git --no-pager diff --stat
